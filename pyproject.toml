[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pickwise"
version = "0.1.0"
description = "An AI research agent that publishes one well-reasoned stock pick every trading day."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vijay Ramakrishnan" }]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.15,<2",
    "yfinance>=1.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pickwise = "pickwise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pickwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
